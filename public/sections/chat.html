<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Voyage Sorgun">
    <meta name="mobile-web-app-capable" content="yes">
    
    <title>Chat - Voyage Sorgun Chat</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">
    
    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
    <link rel="shortcut icon" href="/favicon.ico">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Scripts -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Chat keyboard optimization -->
    <script>
        // Android ve iOS için klavye optimizasyonu
        document.addEventListener('DOMContentLoaded', function() {
            const messageInput = document.getElementById('messageInput');
            const chatContainer = document.getElementById('chatContainer');
            const inputContainer = document.querySelector('.input-container');
            const chatSection = document.getElementById('chatSection');
            
            let initialViewportHeight = window.innerHeight;
            let isKeyboardVisible = false;
            
            // Sadece chat container yüksekliğini kontrol et
            function ensureFixedPositions() {
                // Chat container'ın yüksekliğini kontrol et
                if (chatContainer && window.visualViewport) {
                    const vvHeight = window.visualViewport.height;
                    const windowHeight = window.innerHeight;
                    const keyboardHeight = windowHeight - vvHeight;
                    
                    if (keyboardHeight > 150) {
                        // Klavye açık - chat container'ı küçült
                        chatContainer.style.bottom = `${keyboardHeight + 143}px`;
                    } else {
                        // Klavye kapalı - chat container'ı normal boyut
                        chatContainer.style.bottom = '143px';
                    }
                }
            }
            
            // Sürekli pozisyon kontrolü
            setInterval(ensureFixedPositions, 100);
            
            if (messageInput) {
                // Section yüklendiğinde otomatik focus
                setTimeout(() => {
                    // iOS için özel klavye açma
                    if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {
                        messageInput.focus();
                        messageInput.click();
                        // iOS'ta bazen iki kez gerekir
                        setTimeout(() => {
                            messageInput.focus();
                        }, 100);
                    } else {
                        messageInput.focus();
                    }
                    // Body scroll'u engelle
                    document.body.classList.add('chat-active');
                    
                    // Visual viewport kontrolü yap
                    if (window.visualViewport) {
                        const vvHeight = window.visualViewport.height;
                        const windowHeight = window.innerHeight;
                        const keyboardHeight = windowHeight - vvHeight;
                        
                        if (keyboardHeight > 150) {
                            // Klavye zaten açık - sadece chat container'ı ayarla
                            if (chatContainer) {
                                chatContainer.style.bottom = `${keyboardHeight + 143}px`;
                            }
                            document.body.classList.add('keyboard-visible');
                        }
                    }
                }, 300);
                
                // Klavye durumunu takip et
                function handleKeyboardVisibility() {
                    const currentHeight = window.innerHeight;
                    const heightDifference = initialViewportHeight - currentHeight;
                    
                    if (heightDifference > 150 && !isKeyboardVisible) {
                        // Klavye açıldı
                        isKeyboardVisible = true;
                        document.body.classList.add('keyboard-visible');
                        
                        // Chat container'ı scroll'u en alta getir
                        setTimeout(() => {
                            if (chatContainer) {
                                chatContainer.scrollTop = chatContainer.scrollHeight;
                            }
                        }, 100);
                        
                    } else if (heightDifference <= 150 && isKeyboardVisible) {
                        // Klavye kapandı
                        isKeyboardVisible = false;
                        document.body.classList.remove('keyboard-visible');
                    }
                }
                
                // Viewport değişikliklerini takip et
                window.addEventListener('resize', handleKeyboardVisibility);
                
                // iOS Safari için özel ayarlar
                if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {
                    messageInput.addEventListener('focus', function() {
                        setTimeout(() => {
                            handleKeyboardVisibility();
                            if (chatContainer) {
                                chatContainer.scrollTop = chatContainer.scrollHeight;
                            }
                        }, 300);
                    });
                    
                    messageInput.addEventListener('blur', function() {
                        setTimeout(() => {
                            handleKeyboardVisibility();
                        }, 100);
                    });
                }
                
                // Visual Viewport API desteği - Sadece chat container yüksekliğini ayarla
                if (window.visualViewport) {
                    window.visualViewport.addEventListener('resize', function() {
                        const vvHeight = window.visualViewport.height;
                        const windowHeight = window.innerHeight;
                        const keyboardHeight = windowHeight - vvHeight;
                        
                        if (keyboardHeight > 150) {
                            document.body.classList.add('keyboard-visible');
                            isKeyboardVisible = true;
                            
                            // Sadece chat container'ın bottom'unu ayarla
                            // Header ve input container sabit kalsın
                            if (chatContainer) {
                                chatContainer.style.bottom = `${keyboardHeight + 143}px`;
                            }
                            
                            // Chat container'ı scroll'u en alta getir
                            setTimeout(() => {
                                if (chatContainer) {
                                    chatContainer.scrollTop = chatContainer.scrollHeight;
                                }
                            }, 100);
                        } else {
                            document.body.classList.remove('keyboard-visible');
                            isKeyboardVisible = false;
                            
                            // Chat container'ı normale döndür
                            if (chatContainer) {
                                chatContainer.style.bottom = '143px';
                            }
                        }
                    });
                }
            }
        });
        
        // Section aktif olduğunda focus yap
        function initChatSection() {
            const messageInput = document.getElementById('messageInput');
            if (messageInput) {
                setTimeout(() => {
                    // iOS için özel klavye açma
                    if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {
                        messageInput.focus();
                        messageInput.click();
                        setTimeout(() => {
                            messageInput.focus();
                        }, 100);
                    } else {
                        messageInput.focus();
                    }
                    // Body scroll'u engelle
                    document.body.classList.add('chat-active');
                }, 200);
            }
        }
        
        // Section kapatıldığında body scroll'u restore et
        function cleanupChatSection() {
            document.body.classList.remove('chat-active');
            document.body.classList.remove('keyboard-visible');
        }
        
        // Eğer section loader kullanılıyorsa
        if (window.VoyageApp && window.VoyageApp.onSectionLoad) {
            window.VoyageApp.onSectionLoad('chat', initChatSection);
            window.VoyageApp.onSectionUnload('chat', cleanupChatSection);
        }
    </script>
</head>
<body>
    <div class="content-section" id="chatSection">
      <div class="section-header">
        <h1 class="section-header-title" data-i18n="chat">Sohbetler</h1>
        <div class="section-header-subtitle">
          <span class="connection-status" id="connectionStatus"></span>
          <span id="statusText" data-i18n="connecting">Bağlanıyor...</span>
        </div>
      </div>

      <div class="chat-container" id="chatContainer">
        <!-- Messages will be loaded here -->
        <div class="typing-indicator" id="typingIndicator">
          <div class="message-avatar">
            <div class="voyage-logo">
              <svg viewBox="0 0 120 60" xmlns="http://www.w3.org/2000/svg">
                <rect x="2" y="2" width="116" height="56" fill="none" stroke="#8B0000" stroke-width="1.5" rx="2"/>
                <text x="60" y="22" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#8B0000" text-anchor="middle">VOYAGE</text>
              </svg>
            </div>
          </div>
          <div class="typing-dots">
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
          </div>
        </div>
      </div>

      <div class="input-container">
        <div class="input-wrapper">
          <textarea id="messageInput" 
                    placeholder="Mesajınızı yazın..." 
                    data-i18n-placeholder="typeMessage" 
                    rows="1" 
                    autofocus
                    autocomplete="off"
                    autocorrect="on"
                    autocapitalize="sentences"
                    spellcheck="true"
                    inputmode="text"
                    enterkeyhint="send"
                    onkeypress="handleKeyPress(event)" 
                    oninput="handleInputChange()"></textarea>
        </div>
        <div class="action-buttons">
          <button class="send-btn" id="sendBtn" onclick="sendMessage()">
            <i data-lucide="send" class="icon icon-md"></i>
          </button>
        </div>
      </div>
    </div>
</body>
</html>
