<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Voyage Sorgun">
    <meta name="mobile-web-app-capable" content="yes">
    
    <title>Chat - Voyage Sorgun Chat</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">
    
    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
    <link rel="shortcut icon" href="/favicon.ico">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Scripts -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Chat keyboard optimization - Visual Viewport API (reference pattern) -->
    <script>
        (function() {
            'use strict';
            const BOTTOM_NAV = 84;
            const INPUT_MIN_HEIGHT = 60;
            const HEADER_HEIGHT = 80;

            let vvResizeHandler, vvScrollHandler, resizeFallback;
            let messageInput, chatContainer, inputContainer, chatSection, sectionHeader;

            function scrollToTop() {
                if (chatContainer) chatContainer.scrollTop = 0;
            }

            function updateViewport() {
                if (!chatSection) return;
                if (!window.visualViewport) {
                    chatSection.style.height = window.innerHeight + 'px';
                    chatSection.style.top = '0';
                    if (sectionHeader) sectionHeader.style.removeProperty('top');
                    if (inputContainer) inputContainer.style.setProperty('bottom', BOTTOM_NAV + 'px', 'important');
                    if (chatContainer) chatContainer.style.setProperty('bottom', (BOTTOM_NAV + INPUT_MIN_HEIGHT) + 'px', 'important');
                    scrollToTop();
                    return;
                }
                const vv = window.visualViewport;
                const visibleHeight = vv.height;
                const offsetTop = vv.offsetTop;
                const innerHeight = window.innerHeight;
                const visibleBottomOffset = innerHeight - offsetTop - visibleHeight;
                const inputBottom = Math.max(visibleBottomOffset, BOTTOM_NAV);
                const chatBottom = inputBottom + INPUT_MIN_HEIGHT;

                chatSection.style.height = visibleHeight + 'px';
                chatSection.style.top = offsetTop + 'px';
                if (sectionHeader) sectionHeader.style.setProperty('top', offsetTop + 'px', 'important');
                if (chatContainer) {
                    chatContainer.style.setProperty('top', (offsetTop + HEADER_HEIGHT) + 'px', 'important');
                    chatContainer.style.setProperty('bottom', chatBottom + 'px', 'important');
                }
                if (inputContainer) inputContainer.style.setProperty('bottom', inputBottom + 'px', 'important');

                if (visibleBottomOffset > 100) document.body.classList.add('keyboard-visible');
                else document.body.classList.remove('keyboard-visible');

                scrollToTop();
            }

            function setupViewportListeners() {
                if (window.visualViewport) {
                    vvResizeHandler = updateViewport;
                    vvScrollHandler = updateViewport;
                    window.visualViewport.addEventListener('resize', vvResizeHandler);
                    window.visualViewport.addEventListener('scroll', vvScrollHandler);
                    updateViewport();
                }
                resizeFallback = function() {
                    if (!window.visualViewport) updateViewport();
                };
                window.addEventListener('resize', resizeFallback);
            }

            function removeViewportListeners() {
                if (window.visualViewport) {
                    if (vvResizeHandler) window.visualViewport.removeEventListener('resize', vvResizeHandler);
                    if (vvScrollHandler) window.visualViewport.removeEventListener('scroll', vvScrollHandler);
                }
                if (resizeFallback) window.removeEventListener('resize', resizeFallback);
            }

            document.addEventListener('DOMContentLoaded', function() {
                messageInput = document.getElementById('messageInput');
                chatContainer = document.getElementById('chatContainer');
                inputContainer = document.querySelector('.input-container');
                chatSection = document.getElementById('chatSection');
                sectionHeader = chatSection && chatSection.querySelector('.section-header');

                if (!chatSection) return;

                chatSection.style.position = 'fixed';
                chatSection.style.left = '0';
                chatSection.style.right = '0';

                setupViewportListeners();

                if (messageInput) {
                    setTimeout(() => {
                        if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {
                            messageInput.focus();
                            messageInput.click();
                            setTimeout(() => messageInput.focus(), 100);
                        } else {
                            messageInput.focus();
                        }
                        document.body.classList.add('chat-active');
                        updateViewport();
                    }, 300);

                    if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {
                        messageInput.addEventListener('focus', () => setTimeout(() => {
                            updateViewport();
                            scrollToTop();
                        }, 350));
                    }
                }
            });

            function initChatSection() {
                messageInput = document.getElementById('messageInput');
                chatContainer = document.getElementById('chatContainer');
                inputContainer = document.querySelector('.input-container');
                chatSection = document.getElementById('chatSection');
                sectionHeader = chatSection && chatSection.querySelector('.section-header');
                if (chatSection) {
                    chatSection.style.position = 'fixed';
                    chatSection.style.left = '0';
                    chatSection.style.right = '0';
                    setupViewportListeners();
                    updateViewport();
                }
                if (messageInput) {
                    setTimeout(() => {
                        if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {
                            messageInput.focus();
                            messageInput.click();
                            setTimeout(() => messageInput.focus(), 100);
                        } else messageInput.focus();
                        document.body.classList.add('chat-active');
                        updateViewport();
                    }, 200);
                }
            }

            function cleanupChatSection() {
                removeViewportListeners();
                document.body.classList.remove('chat-active');
                document.body.classList.remove('keyboard-visible');
                if (sectionHeader) sectionHeader.style.removeProperty('top');
                if (chatSection) {
                    chatSection.style.height = '';
                    chatSection.style.top = '';
                    chatSection.style.position = '';
                    chatSection.style.left = '';
                    chatSection.style.right = '';
                }
                if (inputContainer) inputContainer.style.removeProperty('bottom');
                if (chatContainer) {
                    chatContainer.style.removeProperty('top');
                    chatContainer.style.removeProperty('bottom');
                }
            }

            if (window.VoyageApp && window.VoyageApp.onSectionLoad) {
                window.VoyageApp.onSectionLoad('chat', initChatSection);
                window.VoyageApp.onSectionUnload('chat', cleanupChatSection);
            }
        })();
    </script>
</head>
<body>
    <div class="content-section" id="chatSection">
      <div class="section-header">
        <h1 class="section-header-title" data-i18n="chat">Sohbetler</h1>
        <div class="section-header-subtitle">
          <span class="connection-status" id="connectionStatus"></span>
          <span id="statusText" data-i18n="connecting">Bağlanıyor...</span>
        </div>
      </div>

      <div class="chat-container" id="chatContainer">
        <!-- Messages will be loaded here -->
        <div class="typing-indicator" id="typingIndicator">
          <div class="message-avatar">
            <div class="voyage-logo">
              <svg viewBox="0 0 120 60" xmlns="http://www.w3.org/2000/svg">
                <rect x="2" y="2" width="116" height="56" fill="none" stroke="#8B0000" stroke-width="1.5" rx="2"/>
                <text x="60" y="22" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#8B0000" text-anchor="middle">VOYAGE</text>
              </svg>
            </div>
          </div>
          <div class="typing-dots">
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
          </div>
        </div>
      </div>

      <div class="input-container">
        <div class="input-wrapper">
          <textarea id="messageInput" 
                    placeholder="Mesajınızı yazın..." 
                    data-i18n-placeholder="typeMessage" 
                    rows="1" 
                    autofocus
                    autocomplete="off"
                    autocorrect="on"
                    autocapitalize="sentences"
                    spellcheck="true"
                    inputmode="text"
                    enterkeyhint="send"
                    onkeypress="handleKeyPress(event)" 
                    oninput="handleInputChange()"></textarea>
        </div>
        <div class="action-buttons">
          <button class="send-btn" id="sendBtn" onclick="sendMessage()">
            <i data-lucide="send" class="icon icon-md"></i>
          </button>
        </div>
      </div>
    </div>
</body>
</html>
