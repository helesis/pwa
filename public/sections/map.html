<!-- map.html -->
<div class="content-section" id="mapSection">
  <div class="section-header">
    <h1 class="section-header-title" data-i18n="map">Harita</h1>
  </div>

  <div class="map-section">
    <div id="locationPermissionBanner" class="location-permission-banner" style="display: none;">
      <div style="display: flex; align-items: center; gap: 12px; flex: 1;">
        <i data-lucide="map-pin" class="icon icon-lg"></i>
        <div style="flex: 1;">
          <div style="font-weight: 500; font-size: 14px; margin-bottom: 4px;" id="permissionBannerTitle">Konumunuza ihtiyacımız var</div>
          <div style="font-size: 12px; color: #667781;" id="permissionBannerMessage">Haritada konumunuzu göstermek için konum iznine ihtiyacımız var.</div>
        </div>
      </div>
      <button id="permissionBannerBtn" onclick="handlePermissionBannerClick()" style="padding: 8px 16px; background: #008069; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; white-space: nowrap;">Konum Ver</button>
    </div>

    <div class="info-card">
      <div class="info-card-title" data-i18n="map">Harita</div>
      <div class="info-card-content">
        <div class="map-search">
          <div class="map-search-label" data-i18n="mapSearchLabel">Gitmek istediğiniz yer</div>
          <div class="map-search-input-wrapper">
            <input type="text" id="mapSearchInput" class="map-search-input" placeholder="Oda numarası veya alan adı yazın" data-i18n-placeholder="mapSearchPlaceholder"/>
          </div>
          <div class="map-suggestions" id="mapSuggestions"></div>
        </div>
        <div class="map-container" style="height: 500px; min-height: 500px;">
          <div id="mapContainer" style="width: 100%; height: 100%; position: relative;">
            <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 20px; text-align: center; color: #667781; z-index: 1;" data-i18n="mapLoading">Harita yükleniyor...</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
